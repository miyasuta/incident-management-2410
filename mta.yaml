_schema-version: 3.3.0
ID: incident-management-2410
description: A simple CAP project.
version: 1.0.0
modules:
  - name: incident-management-2410-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: incident-management-2410-db
      - name: incident-management-2410-auth
        parameters:
          config:
            credential-type: "X509_GENERATED"
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpacks:
        - https://github.com/SAP/cloud-authorization-buildpack/releases/latest/download/opa_buildpack.zip 
        - nodejs_buildpack
      readiness-health-check-http-endpoint: /health
      readiness-health-check-type: http
    build-parameters:
      builder: npm
    properties:
      AMS_DCL_ROOT: "ams/dcl"
  - name: incident-management-2410-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: incident-management-2410-db
    parameters:
      buildpack: nodejs_buildpack
  - name: incident-management-2410-app-deployer
    type: com.sap.application.content
    path: .
    parameters:
      config:
        destinations:
          - forwardAuthToken: true
            HTML5.IASDependencyName: incidents-api
            name: incident-management-2410-srv-api
            url: ~{srv-api/srv-url}
          - name: ui5
            url: https://ui5.sap.com
    requires:
      - name: srv-api
      - name: incident-management-2410-auth
      - name: incident-management-2410-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources/
      requires:
        - artifacts:
            - nsincidents.zip
          name: nsincidents
          target-path: resources/
  - name: incident-management-2410-destination-content
    type: com.sap.application.content
    requires:
      - name: incident-management-2410-destination-service
        parameters:
          content-target: true
      - name: incident-management-2410-html5-repo-host
        parameters:
          service-key:
            name: incident-management-2410-html5-repo-host-key
      # - name: incident-management-2410-auth
      #   parameters:
      #     service-key:
      #       name: incident-management-2410-auth-key
      - name: incident-management-2410-html5-repo-runtime
        parameters:
          service-key:
            name: incident-management-2410-html5-repo-runtime-key
    parameters:
      content:
        subaccount:
          destinations:
            - Name: incident-management_cdm
              ServiceInstanceName: incident-management-2410-html5-repo-runtime
              ServiceKeyName: incident-management-2410-html5-repo-runtime-key
              URL: https://html5-apps-repo-rt.cfapps.us10.hana.ondemand.com/applications/cdm/incidents
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true
  - name: nsincidents
    type: html5
    path: app/incidents
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
        - npm ci
        - npm run build
      supported-platforms:
        []

resources:
  - name: incident-management-2410-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: incident-management-2410-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: incident-management-2410-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  # - name: incident-management-2410-auth
  #   type: org.cloudfoundry.managed-service
  #   parameters:
  #     config:
  #       tenant-mode: dedicated
  #       xsappname: incident-management-2410-${org}-${space}
  #     path: ./xs-security.json
  #     service: xsuaa
  #     service-plan: application
  - name: incident-management-2410-auth
    parameters:
      path: ./ias-config.json
      service-plan: application
      service: identity
    type: org.cloudfoundry.managed-service  
  - name: incident-management-2410-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        init_data:
          subaccount:
            destinations:
              - Authentication: NoAuthentication
                Name: incident-management-2410-rt
                ProxyType: Internet
                Type: HTTP
                URL: https://91fec855trial.launchpad.cfapps.us10.hana.ondemand.com
                CEP.HTML5contentprovider: true
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: incident-management-2410-destination-service
      service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - mkdir -p resources
        - cp workzone/cdm.json resources/cdm.json
